<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bildgalleri - Melvin Danielsson</title>
</head>
<body>


    <header>
        <h1>Lite bilder från min vardag</h1>
        
        <form role="search">
            <label for="site-search">Sök efter bilder</label>
            <input type="search" name="searchbar" id="site-search" placeholder="Sök...">
            <button type="submit">Sök</button>
        </form>
    </header>

    <hr>

    <main id="main-content">
        
        <section aria-labelledby="heading-bilen">
            <h2 id="heading-bilen">Bilen</h2>
            <ul>
                <li>
                    <img src="bild.jpg" alt="Min bil sedd framifrån på en parkering">
                </li>
                <li>
                    <img src="bild.jpg" alt="Närbild på bilens fälg">
                </li>
                <li><img src="bild.jpg" alt="Beskrivning av bild 3"></li>
            </ul>
        </section>

        <hr>

        <section aria-labelledby="heading-koket">
            <h2 id="heading-koket">Köket</h2>
            <ul>
                <li><img src="bild.jpg" alt="Nyrenoverad köksbänk i marmor"></li>
                <li><img src="bild.jpg" alt="Matbordet dukat för middag"></li>
                </ul>
        </section>

        <hr>

        <section aria-labelledby="heading-badrummet">
            <h2 id="heading-badrummet">Badrummet</h2>
            <ul>
                <li><img src="bild.jpg" alt="Handfatet med ny blandare"></li>
                <li><img src="bild.jpg" alt="Duschkabinen"></li>
            </ul>
        </section>

        <hr>

        <section aria-labelledby="heading-utomhus">
            <h2 id="heading-utomhus">Utomhus</h2>
            <ul>
                <li><img src="bild.jpg" alt="Trädgården i solsken"></li>
                <li><img src="bild.jpg" alt="Grannens katt på staketet"></li>
            </ul>
        </section>

    </main>

    <hr>

    <footer>
        <p>&copy; 2024 Melvin Danielsson</p>
    </footer>

</body>
</html>
