<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bildgalleri - Melvin Danielsson</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <header>
        <h1>Melvin Zoo</h1>
        
        <form role="search">
            <label for="site-search">Sök efter bilder</label>
            <input type="search" name="searchbar" id="site-search" placeholder="Sök...">
            <button type="submit">SÖK</button>
        </form>

        <nav id="category-buttons-nav">
            <button id="all">Alla</button>
            <button id="birds">Fåglar</button>
            <button id="fish">Fiskar</button>
            <button id="insects">Insekter</button>
            <button id="mammals">Däggdjur</button>
        </nav>
    </header>


    <main id="main-content">
        
        <section id="image-section">
            
        </section>

        <div class="hidden" id="background-dimmer">
            <section id="full-image-section">
                <button class="hidden" id="close">Tillbaka</button>
                <img class="hidden" src="" alt="full image" id="full-image">
            </section>
        </div>
    </main>


    <footer>
        <p>&copy; 2026 Melvin Danielsson</p>
    </footer>
<script src="script.js"></script>
</body>
</html>
